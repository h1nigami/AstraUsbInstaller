name: Проверки и выпуск C# станции

# Кроссплатформенная версия собирается отдельно от Python-версии: у них разные
# архивы и разные установщики. Станция качает архив своей платформы и сверяет
# его контрольную сумму, поэтому сумма кладётся рядом с каждым архивом.

on:
  pull_request:
    branches: [master]
    paths: ['avalonia/**', '.github/workflows/release-station.yml']
  push:
    branches: [master]
    paths: ['avalonia/**', '.github/workflows/release-station.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Тег для пробной сборки
        required: true

permissions:
  contents: write

jobs:
  verify:
    permissions:
      contents: read
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'release' && github.event.release.prerelease == true && startsWith(github.event.release.tag_name, 'v2.')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v2.'))
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Полный набор C# на Windows
        if: runner.os == 'Windows'
        run: dotnet test avalonia/AstraUsb.Tests/AstraUsb.Tests.csproj -c Release
      - name: Проверки C# на Linux
        if: runner.os == 'Linux'
        # Положительные тесты временного архива идут на Windows: Linux
        # запрещает назначение на системном диске, включая /tmp runner.
        run: >-
          dotnet test avalonia/AstraUsb.Tests/AstraUsb.Tests.csproj -c Release
          --filter 'FullyQualifiedName~CollectionLogTests|FullyQualifiedName~OperationGuardTests|FullyQualifiedName~UpdateTests|FullyQualifiedName~UsbWatcherTests|FullyQualifiedName~DeviceIdentifierTests|FullyQualifiedName~DeviceRegistryTests|FullyQualifiedName~VideoPreviewTests|FullyQualifiedName~ArchivePathTests|FullyQualifiedName~Successive_mountpoints|(FullyQualifiedName~ArchiveGuardTests&FullyQualifiedName!~Marking_makes_the_volume_usable)'
      - name: Native I/O, обновление и установщики Linux
        if: runner.os == 'Linux'
        run: |
          set -eu
          for script in avalonia/*.sh avalonia/packaging/*.sh avalonia/AstraUsb.Tests/*.sh; do
            bash -n "$script"
          done
          docker run --rm --network none -e ARCHIVE_LEAF_TEST_CONTAINER=1 \
            -v "$PWD:/src:ro" mcr.microsoft.com/dotnet/sdk:8.0 \
            sh /src/avalonia/AstraUsb.Tests/archive-leaf-integration.sh
          for scenario in busy offline-busy offline-lock mismatch restarts success handoff; do
            docker run --rm --network none -e UPDATER_TEST_CONTAINER=1 \
              -v "$PWD:/src:ro" mcr.microsoft.com/dotnet/sdk:8.0 \
              sh /src/avalonia/AstraUsb.Tests/updater-integration.sh "$scenario"
          done
          for script in installer-guard package-guard; do
            docker run --rm --network none -e UPDATER_TEST_CONTAINER=1 \
              -v "$PWD:/src:ro" mcr.microsoft.com/dotnet/sdk:8.0 \
              bash "/src/avalonia/AstraUsb.Tests/$script.sh"
          done

  build:
    needs: verify
    if: (github.event_name == 'release' && github.event.release.prerelease == true && startsWith(github.event.release.tag_name, 'v2.')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v2.'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      # Релиз собирается только из того, что уже в master. v1.15 и v1.16
      # собрали из отдельной ветки, отведённой от v1.13, и станции при
      # обновлении потеряли всё, что вошло в v1.14. Тег на коммите вне
      # master здесь останавливает сборку: ни одного архива к релизу не
      # прикрепится, и апдейтеры его пропустят.
      - name: Тег должен быть в master
        # Пробная сборка по кнопке ничего не публикует, её не ограничиваем.
        if: github.event_name == 'release'
        # На windows-latest оболочка по умолчанию PowerShell: без явного bash
        # шаг падал бы на каждом релизе и установщик не прикреплялся бы.
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin master
          COMMIT="$(git rev-parse "$TAG^{commit}")"
          if ! git merge-base --is-ancestor "$COMMIT" origin/master; then
            echo "::error::Тег $TAG указывает на $COMMIT, которого нет в master. Влейте изменения в master и выпустите новый тег."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Сборка архивов
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PUBLISHED: ${{ github.event.release.published_at }}
        run: |
          set -e
          DATE="${PUBLISHED:0:10}"
          [ -n "$DATE" ] || DATE="$(date +%F)"
          mkdir -p dist

          for RID in linux-x64 linux-arm64 win-x64; do
            echo "--- $RID"
            OUT="build/$RID"
            dotnet publish avalonia/AstraUsb/AstraUsb.csproj \
              -c Release -r "$RID" --self-contained true \
              -p:PublishSingleFile=false -o "$OUT"

            echo "$TAG $DATE" > "$OUT/VERSION"

            # Установщик, запуск и правило udev нужны только станциям на Linux.
            case "$RID" in
              linux-*)
                cp avalonia/start_native.sh avalonia/install_native.sh \
                   avalonia/99-astra-usb-avalonia-udisks.rules "$OUT/"
                # Значок ярлыка на рабочем столе.
                cp avalonia/AstraUsb/Assets/logo.png "$OUT/logo.png"
                chmod +x "$OUT/AstraUsb" "$OUT/start_native.sh" "$OUT/install_native.sh"
                ;;
            esac

            NAME="bestcam-station-$TAG-$RID"
            case "$RID" in
              win-*)
                (cd build && zip -qr "../dist/$NAME.zip" "$RID")
                FILE="dist/$NAME.zip"
                ;;
              *)
                tar -czf "dist/$NAME.tar.gz" -C "build/$RID" .
                FILE="dist/$NAME.tar.gz"
                ;;
            esac

            # Для Linux рядом с архивом кладётся пакет: с ним зависимости
            # ставит apt, а удаление идёт штатно, вместе со службами.
            case "$RID" in
              linux-x64)   DEB=$(bash avalonia/packaging/build_deb.sh "$OUT" "$TAG" amd64 dist) ;;
              linux-arm64) DEB=$(bash avalonia/packaging/build_deb.sh "$OUT" "$TAG" arm64 dist) ;;
              *)           DEB="" ;;
            esac

            if [ -n "$DEB" ]; then
              (cd dist && sha256sum "$(basename "$DEB")" > "$(basename "$DEB").sha256")
            fi

            # Сумма считается от имени файла без пути: станция сверяет её
            # ровно в том виде, в каком пишет sha256sum.
            (cd dist && sha256sum "$(basename "$FILE")" > "$(basename "$FILE").sha256")
          done

          ls -la dist

      - name: Прикрепить к релизу
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.sha256

      - name: Сохранить как артефакт сборки
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: station-${{ inputs.tag }}
          path: dist

      # Инструкция по установке дописывается в конец описания каждого релиза,
      # чтобы её не приходилось копировать руками. Текст, набранный при
      # публикации, сохраняется: блок добавляется после него.
      - name: Дописать инструкцию по установке
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --json body -q .body > /tmp/body.md
          if ! grep -q '^## Установка$' /tmp/body.md; then
            printf '\n' >> /tmp/body.md
            sed -e "s/TAG_HERE/$TAG/g" -e "s/VERSION_HERE/${TAG#v}/g" \
              .github/release-station-install.md >> /tmp/body.md
            # Только тело описания. `gh release edit` заодно переставляет
            # метку latest на редактируемый релиз, а релиз станции C# latest
            # получать не должен: его увидели бы апдейтеры Python.
            ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" -q .id)
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -f body="$(cat /tmp/body.md)" > /dev/null
          fi

  # Установщик для Windows собирается отдельно: Inno Setup идёт только на
  # Windows-машине. Архив при этом никуда не девается, он нужен тем, кто
  # ставит программу без установки.
  windows-setup:
    needs: verify
    if: (github.event_name == 'release' && github.event.release.prerelease == true && startsWith(github.event.release.tag_name, 'v2.')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v2.'))
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      # Релиз собирается только из того, что уже в master. v1.15 и v1.16
      # собрали из отдельной ветки, отведённой от v1.13, и станции при
      # обновлении потеряли всё, что вошло в v1.14. Тег на коммите вне
      # master здесь останавливает сборку: ни одного архива к релизу не
      # прикрепится, и апдейтеры его пропустят.
      - name: Тег должен быть в master
        # Пробная сборка по кнопке ничего не публикует, её не ограничиваем.
        if: github.event_name == 'release'
        # На windows-latest оболочка по умолчанию PowerShell: без явного bash
        # шаг падал бы на каждом релизе и установщик не прикреплялся бы.
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin master
          COMMIT="$(git rev-parse "$TAG^{commit}")"
          if ! git merge-base --is-ancestor "$COMMIT" origin/master; then
            echo "::error::Тег $TAG указывает на $COMMIT, которого нет в master. Влейте изменения в master и выпустите новый тег."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Сборка установщика
        # Шаг идёт на PowerShell: в bash ключи ISCC вида /D и /O
        # превращаются в пути, и компилятор считает их вторым именем скрипта.
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PUBLISHED: ${{ github.event.release.published_at }}
        run: |
          $tag = $env:TAG
          $date = if ($env:PUBLISHED) { $env:PUBLISHED.Substring(0, 10) }
                  else { Get-Date -Format 'yyyy-MM-dd' }

          dotnet publish avalonia/AstraUsb/AstraUsb.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false -o avalonia/windows/payload
          if ($LASTEXITCODE -ne 0) { exit 1 }

          [IO.File]::WriteAllText("$PWD/avalonia/windows/payload/VERSION", "$tag $date`n")

          # Номер версии установщика должен состоять из цифр и точек, а тег
          # приходит и с буквой, и с хвостом вроде «-test».
          $number = ($tag -replace '^v', '') -replace '[^0-9.].*$', ''
          $number = $number.Trim('.')
          if (-not $number) { $number = '0.0.0' }
          $name = "BestCamStationSetup-$tag"
          New-Item -ItemType Directory -Force dist | Out-Null

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$number" "/O$PWD\dist" "/F$name" `
            "avalonia\windows\setup.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $sum = (Get-FileHash "dist\$name.exe" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/$name.exe.sha256", "$sum  $name.exe`n")
          Get-ChildItem dist | Format-Table Name, Length

      - name: Прикрепить к релизу
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BestCamStationSetup-*.exe
            dist/BestCamStationSetup-*.exe.sha256

      - name: Сохранить как артефакт сборки
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-${{ inputs.tag }}
          path: dist
