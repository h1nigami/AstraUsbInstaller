name: Проверки Python

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить Tkinter для проверок GUI
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -c "import tkinter, gui"
      - name: Проверить Python
        run: |
          python -m py_compile gui.py usb_monitor.py main.py updater.py
          python -m unittest discover -s tests -v
      - name: Проверить установку и запуск
        run: |
          for script in install_native.sh start_native.sh update.sh diagnose.sh; do
            bash -n "$script"
          done
